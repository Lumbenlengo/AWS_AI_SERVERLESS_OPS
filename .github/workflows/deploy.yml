# .github/workflows/deploy.yml

name: deploy.yml

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  id-token: write  
  contents: read
  pull-requests: write

env:
  TF_DIR: terraform/environments/dev
  AWS_REGION: us-east-1

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install boto3 pytest ruff
      - name: Lint (ruff)
        run: |
          ruff check functions/
          if [ -d app ]; then ruff check app/; fi
      - name: Unit tests
        run: |
          if [ -d functions/tests ]; then
            pytest functions/tests/ -v
          else
            echo "functions/tests/ not present yet, skipping (added in a later step)"
          fi

  terraform-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/
      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: tflint --chdir=${{ env.TF_DIR }} --recursive

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (IaC security)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: >-
            CKV_AWS_117,CKV_AWS_116,CKV_AWS_115,CKV_AWS_272,
            CKV_AWS_338,CKV_AWS_18,CKV_AWS_144,CKV2_AWS_61,
            CKV2_AWS_62,CKV_AWS_355,CKV_AWS_288,CKV_AWS_289,
            CKV_AWS_286,CKV_AWS_290,CKV_AWS_158,CKV_AWS_173,
            CKV_AWS_145,CKV_AWS_59,CKV_AWS_120,CKV_AWS_225,
            CKV_AWS_149,CKV2_AWS_57,CKV2_AWS_51,CKV2_AWS_29,
            CKV2_AWS_53,CKV_AWS_136,CKV_AWS_51,CKV_AWS_382,
            CKV_AWS_336,CKV_AWS_333,CKV_AWS_258

  plan:
    if: github.event_name == 'pull_request'
    needs: [python-tests, terraform-quality, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8');
            const body = `### Terraform plan\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    needs: [python-tests, terraform-quality, security-scan]
    runs-on: ubuntu-latest
    environment: dev-apply   
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init
          terraform apply -auto-approve -input=false